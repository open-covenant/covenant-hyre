[package]
name = "covenant-hyre-example"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Standalone Rust reproducer of the Covenant + Hyre x402 paid call. Spawns the covenant-x402-signer sidecar; no covenant deps."
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
